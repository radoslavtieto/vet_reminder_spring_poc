services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vetsync
      MYSQL_USER: vetsync
      MYSQL_PASSWORD: local-only
      MYSQL_ROOT_PASSWORD: local-only-root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-only-root"]
      interval: 10s
      timeout: 5s
      retries: 10

  local-seed:
    image: mysql:8.4
    profiles: ["seed"]
    entrypoint: ["sh", "/seed/seed-local.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: vetsync
      MYSQL_USER: vetsync
      MYSQL_PWD: local-only
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./seed-local.sh:/seed/seed-local.sh:ro
      - ../../services/pms-api/src/main/resources/db/seed/local-seed.sql:/seed/local-seed.sql:ro

volumes:
  mysql-data:
