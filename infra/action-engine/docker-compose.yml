services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vetsync
      POSTGRES_USER: vetsync
      POSTGRES_PASSWORD: local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetsync -d vetsync"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
