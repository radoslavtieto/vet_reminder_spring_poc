<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title description">
  <title id="title">VetSync master-data event propagation</title>
  <desc id="description">PMS audit rows are polled by the sync service, published to local RabbitMQ, mapped by the action engine and stored in PostgreSQL with an idempotency inbox.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="planned-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .panel-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; fill: #475569; }
      .label { font-size: 12px; font-weight: 600; fill: #334155; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .planned { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#planned-arrow); }
    </style>
  </defs>
  <rect width="1600" height="940" fill="#ffffff"/>
  <text class="title" x="35" y="46">VetSync - master-data event propagation (implemented POC slice)</text>

  <rect x="30" y="78" width="350" height="710" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="panel-title" x="55" y="115">PMS - source of truth</text>
  <rect class="node" x="65" y="155" width="280" height="78"/>
  <text class="node-title" x="85" y="185">pms-api</text>
  <text class="body" x="85" y="208">Tenant-scoped writes</text>
  <rect class="node" x="65" y="295" width="280" height="90"/>
  <text class="node-title" x="85" y="328">MySQL business tables</text>
  <text class="body" x="85" y="352">Shared schema + tenant_id</text>
  <text class="body" x="85" y="371">Clinic, client, patient, ...</text>
  <rect class="node" x="65" y="465" width="280" height="118"/>
  <text class="node-title" x="85" y="499">audit_master_data</text>
  <text class="body" x="85" y="523">Trigger snapshots with row version</text>
  <text class="body" x="85" y="544">Clinic, client, patient changes</text>
  <text class="body" x="85" y="565">Source remains read-only to sync</text>
  <path class="edge" d="M205 233 L205 290"/>
  <text class="label" x="218" y="267">writes</text>
  <path class="edge" d="M205 385 L205 460"/>
  <text class="label" x="218" y="428">triggers</text>

  <rect x="405" y="78" width="400" height="710" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <text class="panel-title" x="430" y="115">sync-service</text>
  <rect class="node" x="445" y="170" width="320" height="118"/>
  <text class="node-title" x="465" y="202">Scheduled master-data poller</text>
  <text class="body" x="465" y="226">All six tenants; read-only JDBC</text>
  <text class="body" x="465" y="247">5s safety lag + 10s overlap</text>
  <text class="body" x="465" y="268">Patient owner resolved to public ID</text>
  <rect class="node" x="445" y="360" width="320" height="116"/>
  <text class="node-title" x="465" y="393">Versioned SyncEnvelope v1</text>
  <text class="body" x="465" y="418">Stable eventId; source snapshot</text>
  <text class="body" x="465" y="440">Publish confirm before pointer update</text>
  <rect class="node" x="445" y="555" width="320" height="104"/>
  <text class="node-title" x="465" y="589">MongoDB sync_pointers</text>
  <text class="body" x="465" y="614">Monotonic tenant / stream cursor</text>
  <text class="body" x="465" y="636">No lease or sync-side dedupe yet</text>
  <path class="edge" d="M345 524 L390 524 L390 229 L440 229"/>
  <text class="label" x="350" y="507">poll safe, overlapping window</text>
  <path class="edge" d="M605 288 L605 355"/>
  <text class="label" x="618" y="327">convert</text>
  <path class="edge" d="M445 606 L415 606 L415 280 L440 280"/>
  <text class="label" x="418" y="527" transform="rotate(-90 418 527)">read / advance after confirm</text>

  <rect x="830" y="78" width="270" height="710" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="panel-title" x="855" y="115">Local RabbitMQ</text>
  <rect class="node" x="860" y="230" width="210" height="96"/>
  <text class="node-title" x="880" y="266">vetsync.sync</text>
  <text class="body" x="880" y="291">Topic exchange</text>
  <rect class="node" x="860" y="385" width="210" height="96"/>
  <text class="node-title" x="880" y="421">action-engine queue</text>
  <text class="body" x="880" y="446">master-data binding</text>
  <rect class="node" x="860" y="565" width="210" height="90"/>
  <text class="node-title" x="880" y="600">Action Engine DLQ</text>
  <text class="body" x="880" y="625">Rejected deliveries</text>
  <path class="edge" d="M765 418 L855 278"/>
  <text class="label" x="775" y="335">JSON event</text>
  <path class="edge" d="M965 326 L965 380"/>
  <text class="label" x="979" y="357">route</text>
  <path class="planned" d="M965 481 L965 560"/>
  <text class="label" x="980" y="529">reject</text>

  <rect x="1125" y="78" width="445" height="710" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="panel-title" x="1150" y="115">action-engine</text>
  <rect class="node" x="1160" y="170" width="370" height="82"/>
  <text class="node-title" x="1180" y="204">RabbitMQ listener</text>
  <text class="body" x="1180" y="229">Opt-in; reject failures to DLQ</text>
  <rect class="node" x="1160" y="310" width="370" height="125"/>
  <text class="node-title" x="1180" y="344">Anti-corruption mapping</text>
  <text class="body" x="1180" y="369">CLINIC → Site; CLIENT → Contact</text>
  <text class="body" x="1180" y="391">PATIENT → CareSubject + species code</text>
  <text class="body" x="1180" y="413">DELETE → inactive; stale versions ignored</text>
  <rect class="node" x="1160" y="500" width="370" height="135"/>
  <text class="node-title" x="1180" y="534">One PostgreSQL transaction</text>
  <text class="body" x="1180" y="559">Inbox claim + domain upsert</text>
  <text class="body" x="1180" y="581">Duplicate eventId is ignored</text>
  <text class="body" x="1180" y="603">sourceVersion prevents stale overwrite</text>
  <rect class="node" x="1160" y="685" width="370" height="70"/>
  <text class="node-title" x="1180" y="715">PostgreSQL: domain + processed_event</text>
  <text class="body" x="1180" y="739">site, contact, care_subject</text>
  <path class="edge" d="M1070 432 L1155 211"/>
  <text class="label" x="1080" y="317">deliver</text>
  <path class="edge" d="M1345 252 L1345 305"/>
  <path class="edge" d="M1345 435 L1345 495"/>
  <path class="edge" d="M1345 635 L1345 680"/>

  <rect x="30" y="820" width="1540" height="86" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="node-title" x="55" y="852">Not included in this slice</text>
  <text class="body" x="55" y="879">Other audit streams, snapshots, time-window scans, leases, Azure Service Bus adapter, action rules, and dispatch remain roadmap work. Delivery is at-least-once.</text>
</svg>
