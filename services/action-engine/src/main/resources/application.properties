spring.application.name=action-engine
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.vetsync=${APP_LOG_LEVEL:INFO}
logging.structured.format.console=logstash
logging.structured.json.add.application=${spring.application.name}
spring.datasource.url=${ACTION_DB_URL}
spring.datasource.username=${ACTION_DB_USERNAME}
spring.datasource.password=${ACTION_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.rabbitmq.host=${ACTION_RABBITMQ_HOST}
spring.rabbitmq.port=${ACTION_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${ACTION_RABBITMQ_USERNAME}
spring.rabbitmq.password=${ACTION_RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${ACTION_EVENT_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=${ACTION_EVENT_RETRY_DELAY:PT1S}
action.messaging.enabled=${ACTION_MESSAGING_ENABLED:false}
