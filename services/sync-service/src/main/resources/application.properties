spring.application.name=sync-service
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.vetsync=${APP_LOG_LEVEL:INFO}
logging.structured.format.console=logstash
logging.structured.json.add.application=${spring.application.name}
spring.datasource.url=${SYNC_MYSQL_URL}
spring.datasource.username=${SYNC_MYSQL_USERNAME}
spring.datasource.password=${SYNC_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.read-only=true
spring.data.mongodb.uri=${SYNC_MONGODB_URI}
spring.rabbitmq.host=${SYNC_RABBITMQ_HOST}
spring.rabbitmq.port=${SYNC_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SYNC_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SYNC_RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
sync.poll.enabled=${SYNC_POLL_ENABLED:false}
sync.poll.delay-ms=${SYNC_POLL_DELAY_MS:5000}
sync.source.mysql.enabled=${SYNC_MYSQL_ENABLED:false}
sync.source.mysql.url=${SYNC_MYSQL_URL:}
sync.source.mysql.username=${SYNC_MYSQL_USERNAME:}
sync.source.mysql.password=${SYNC_MYSQL_PASSWORD:}
sync.state.mongo.enabled=${SYNC_MONGO_ENABLED:false}
sync.state.mongo.uri=${SYNC_MONGODB_URI:}
sync.state.mongo.database=${SYNC_MONGODB_DATABASE:}
sync.state.mongo.dedupe-retention-days=${SYNC_DEDUPE_RETENTION_DAYS:30}
sync.messaging.service-bus.enabled=${SYNC_SERVICE_BUS_ENABLED:false}
sync.messaging.service-bus.connection-string=${SERVICEBUS_CONNECTION_STRING:}
sync.messaging.service-bus.namespace=${SERVICEBUS_NAMESPACE:}
sync.messaging.service-bus.queue=${SERVICEBUS_QUEUE:}
sync.messaging.service-bus.quarantine-queue=${SERVICEBUS_QUARANTINE_QUEUE:}
sync.messaging.delivery.max-attempts=${SYNC_EVENT_MAX_ATTEMPTS:3}
sync.messaging.delivery.retry-delay=${SYNC_EVENT_RETRY_DELAY:PT1S}
sync.mode=${SYNC_MODE:worker}
sync.poll.batch-size=${SYNC_POLL_BATCH_SIZE:250}
sync.poll.safety-lag=${SYNC_POLL_SAFETY_LAG:PT5S}
sync.poll.overlap-audit-rows=${SYNC_POLL_OVERLAP_AUDIT_ROWS:25}
sync.poll.lease-duration=${SYNC_POLL_LEASE_DURATION:PT5M}
sync.poll.audit-fixed-delay-ms=${SYNC_AUDIT_POLL_DELAY_MS:${SYNC_MASTER_DATA_POLL_DELAY_MS:5000}}
sync.business-zone=${SYNC_BUSINESS_ZONE:Europe/Sofia}
sync.scan.expiry-lead-days=${SYNC_EXPIRY_LEAD_DAYS:30}
sync.scan.invoice-lookback-months=${SYNC_UNPAID_INVOICE_LOOKBACK_MONTHS:6}
sync.scan.invoice-grace-days=${SYNC_INVOICE_GRACE_DAYS:7}
sync.scan.fixed-delay-ms=${SYNC_TIME_WINDOW_POLL_DELAY_MS:3600000}
